<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLAN report</title>
<style>
/* Layout: one reading column. Findings first, then the scorecard, then each area with a plain-language callout. */
:root{
  --bg:#f6f7f5;--panel:#ffffff;--fg:#16201b;--muted:#5b6560;--faint:#8a938e;--line:#dde2de;--soft:#eef1ee;
  --accent:#1f6f8b;--base:#a7aea9;
  --good:#17803d;--good-bg:#e3f3e8;--bad:#b42318;--bad-bg:#fbe6e3;--same:#6b7570;--same-bg:#eceeec;
  --call:#eef5f8;--call-line:#1f6f8b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1311;--panel:#171c19;--fg:#e5eae6;--muted:#9ba59f;--faint:#6f7873;--line:#2a312d;--soft:#1e2420;
  --accent:#63b6d3;--base:#5c6560;
  --good:#5ccb84;--good-bg:#14301f;--bad:#f2867b;--bad-bg:#3a1916;--same:#9aa39e;--same-bg:#242a26;
  --call:#14252c;--call-line:#63b6d3;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1311;--panel:#171c19;--fg:#e5eae6;--muted:#9ba59f;--faint:#6f7873;--line:#2a312d;--soft:#1e2420;
  --accent:#63b6d3;--base:#5c6560;
  --good:#5ccb84;--good-bg:#14301f;--bad:#f2867b;--bad-bg:#3a1916;--same:#9aa39e;--same-bg:#242a26;
  --call:#14252c;--call-line:#63b6d3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1{font-size:26px;font-weight:650;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;font-weight:650;margin:0}
h3{font-size:14px;font-weight:650;margin:0;display:flex;align-items:center}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:12px}
.bar-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctrls label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
select,button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
button{cursor:pointer}button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,.i:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--fg);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-direction:column;gap:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.callout{background:var(--call);border-left:3px solid var(--call-line);border-radius:0 8px 8px 0;padding:10px 14px;font-size:14px;max-width:90ch}
.callout b{font-weight:650}
.callout ul{margin:6px 0 0;padding-left:18px}.callout li{margin:3px 0}
.findings{display:grid;gap:8px}
.finding{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:var(--same)}
.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.dot.same{background:var(--same)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--soft);font-weight:650;font-size:12px;color:var(--muted);padding:5px 10px;letter-spacing:.02em}
td.num,th.num{text-align:right;white-space:nowrap}
.mname{font-weight:600;display:flex;align-items:center}
.mexp{font-size:12px;color:var(--muted);margin-top:2px;max-width:48ch;line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;border-radius:999px;padding:2px 9px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.good{color:var(--good);background:var(--good-bg)}.chip.bad{color:var(--bad);background:var(--bad-bg)}.chip.same{color:var(--same);background:var(--same-bg)}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}.delta.same{color:var(--same)}
.chg-row td{background:var(--bad-bg)}
.chg-row.good td{background:var(--good-bg)}
.i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font:italic 600 11px/1 Georgia,serif;margin-left:6px;cursor:help;position:relative;flex:none}
.i:hover{color:var(--fg);border-color:var(--fg)}
.i .pop{display:none;position:absolute;top:22px;left:-10px;z-index:30;width:min(420px,80vw);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.22);padding:10px 12px;font:400 12px/1.5 var(--sans);color:var(--fg);text-align:left;white-space:normal;cursor:auto}
.i:hover .pop,.i:focus .pop{display:block}
.i .pop code{font-family:var(--mono);font-size:11px;word-break:break-all;display:block;margin:2px 0}
.i .pop .k{color:var(--muted)}
.spark{display:block;width:120px;height:28px}
.spark.wide{width:100%;height:32px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span.nolegend::before{display:none}
.sp-dates{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);line-height:1}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.hbar .lab{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{display:flex;flex-direction:column;gap:2px;min-width:0}
.hbar .b{height:9px;border-radius:2px;min-width:1px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.err{color:var(--bad);font-size:12px}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--fg);font-weight:600}
.src-list{display:grid;grid-template-columns:minmax(160px,auto) 1fr;gap:4px 14px;margin-top:10px}
.dtable.eptable td{white-space:normal;vertical-align:top;color:var(--fg)}.eptable code{font-family:var(--mono);font-size:11px;white-space:nowrap}
.src-list code{font-family:var(--mono);font-size:12px;color:var(--fg);word-break:break-all}
input[type=file]{display:none}
.exp{display:inline-flex;align-items:center;gap:6px}
.disclaimer-r{margin-top:8px;border:1px solid var(--good);background:var(--good-bg);color:var(--fg);border-radius:8px;padding:8px 12px}
.foot{text-align:center;margin-top:-8px}
.modebtn{display:inline-flex;align-items:center;gap:7px;font-weight:600}
@media print{
  @page{margin:12mm}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0;gap:16px}
  .bar-top,.rz,.x,.chev,.i,.dsearch,.drow,input[type=file]{display:none!important}
  .card,.tile,.guide,.finding,.callout,tr{break-inside:avoid}
  h2{break-after:avoid}
  .tile{border-color:#ccc}
  .sc-wrap.open{flex-direction:column;gap:12px}.sc-wrap .dpanel{width:100%;flex:none;position:static;max-height:none}
  .dscroll,.tbl-wrap{overflow:visible}
  details>summary{list-style:none}
  a{color:inherit;text-decoration:none}
}
.warnline{margin-top:8px;font-size:13px;color:var(--fg);background:var(--same-bg);border-radius:7px;padding:6px 10px;max-width:90ch}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:14px;align-items:start}
@media (max-width:860px){.ov{grid-template-columns:minmax(0,1fr)}}
.ov-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--call)}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tile .tchg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tile.outg{border-style:dashed;border-color:var(--faint)}
.tile.alertt{border-color:var(--bad)}
.tile.warnt{border-color:var(--sub)}
.rlines{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.dot.sm{width:7px;height:7px;margin:0 6px 1px 0;display:inline-block;vertical-align:middle}
.side-list.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.radgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mini{display:flex;flex-direction:column;gap:8px;margin:4px 0}
.mini .qchips{margin:0}
.mini-scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.mini .dtable th{position:sticky;top:0;background:var(--panel);z-index:1}
.stcell{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.stcell .dot{margin:0}
.qchip:disabled{opacity:.45;cursor:default}
.radlist{display:flex;flex-direction:column;gap:16px}
.radlist .rad{border-top:0;padding-top:0}
.radhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.radhead .dot{margin:0}
.radsum{margin-left:auto;font-size:13px;color:var(--muted)}
.radgrid .rad{border-top:0;padding-top:0}
.gnote{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
.guide{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.guide ol{margin:0;padding-left:20px}.guide li{margin:3px 0}
.guide-h{display:flex;justify-content:space-between;align-items:center}
.guide .x{border:0;background:transparent;font-size:20px;line-height:1;padding:0 4px;color:var(--muted)}
.guide a{color:var(--accent)}
.ptable{font-size:13px}.ptable td{vertical-align:top}.ptable th{white-space:nowrap}
.ptable td:first-child{min-width:200px;max-width:280px;overflow-wrap:anywhere}
.ptable td:nth-child(2){white-space:nowrap}
.pc-name{display:flex;align-items:flex-start;gap:7px}.pc-name .dot{margin-top:5px}
.pc-cause{font-weight:600;margin-bottom:4px;max-width:340px}
.pc-sig{display:flex;flex-wrap:wrap;gap:4px;max-width:340px}
.pc-do ol{margin:0;padding-left:18px;max-width:420px}.pc-do li{margin:2px 0}
.pc-btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
tr.pc-same td{opacity:.7}
.bandbtns{gap:8px;margin:0}
.bandbtn{flex-direction:column;align-items:flex-start;gap:1px;border-radius:10px;padding:8px 14px;min-width:150px}
.bandbtn .bb-l{font-weight:650;font-size:14px}.bandbtn .bb-n{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}.bandbtn .bb-s{font-size:11px;color:var(--muted)}
.cbfilters{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cbfilters label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cbgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
@media (max-width:1000px){.cbgrid{grid-template-columns:minmax(0,1fr)}}
.cbar{height:9px;background:var(--soft);border-radius:3px;overflow:hidden}.cbar span{display:block;height:100%;border-radius:3px}
:root{--b24:#d97706;--b5:#2a78d6;--b6:#1baf7a}
.qb.band24{background:color-mix(in srgb,var(--b24) 18%,transparent);color:var(--b24)}.qb.band5{background:color-mix(in srgb,var(--b5) 18%,transparent);color:var(--b5)}.qb.band6{background:color-mix(in srgb,var(--b6) 18%,transparent);color:var(--b6)}
tr.rrow2{cursor:pointer}tr.rrow2:hover td{background:var(--soft)}tr.rrow2.rsel td{background:var(--call)}
.tlink{font-size:12px;color:var(--accent);margin-top:4px;font-weight:600}
.gbtn.sm{font-size:12px;padding:4px 10px;white-space:nowrap}
.guide-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.gbtn{font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.gbtn:hover{background:var(--call)}
.gbtn.primary{background:var(--accent);color:var(--panel)}
.gbtn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.gbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gbtn .arr{font-size:16px;line-height:1}
.gsrc{margin-left:auto;font-size:12px;color:var(--muted);display:inline-flex;align-items:center}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent);background:var(--call)}100%{box-shadow:0 0 0 14px transparent;background:transparent}}
section.flash{animation:flash 1.4s ease-out;border-radius:12px}
@media (prefers-reduced-motion:reduce){section.flash{animation:none}}
.side{display:flex;flex-direction:column;gap:8px}
.side-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.side-list li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.side-list .dot{margin-top:5px}
.dot.warn{background:#c08a1e}
.rad{display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.rad:first-child{border-top:0}
td.gcol{font-size:13px;white-space:nowrap}
.wrap{transition:max-width .2s}
.wrap.wide{max-width:min(1900px,100%)}
.sc-wrap{display:flex;align-items:flex-start;gap:0}
.sc-wrap>.card:first-child{flex:1 1 0;min-width:0}
.sc-wrap.open>.card:first-child{min-width:440px}
.sc-wrap .dpanel{flex:0 0 var(--pw,min(760px,52%));min-width:360px}
.rz{flex:0 0 14px;align-self:stretch;cursor:col-resize;position:relative;touch-action:none}
.rz::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;border-radius:2px;background:var(--line)}
.rz:hover::before,.rz.drag::before,.rz:focus-visible::before{background:var(--accent)}
.rz:focus-visible{outline:none}
@media (max-width:1000px){.sc-wrap.open{flex-direction:column;gap:12px}.sc-wrap.open>.card:first-child{min-width:0;width:100%}.sc-wrap .dpanel{flex:none;width:100%;min-width:0}.rz{display:none}}
tr.drill{cursor:pointer}
tr.drill:hover td{background:var(--soft)}
tr.drill:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr.drill.on td{background:var(--call)}
.chev{margin-left:auto;padding-left:8px;color:var(--faint);font-size:12px}
.dpanel{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 24px);min-width:0}
.dpanel-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dpanel .x{border:0;background:transparent;font-size:22px;line-height:1;padding:0 4px;color:var(--muted)}
.drow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dsearch{flex:1;min-width:160px;font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.dscroll{overflow:auto;min-height:0}
.dtable{font-size:13px}.dtable td{padding:7px 8px;white-space:nowrap}.dtable th{padding:0;position:sticky;top:0;background:var(--panel);z-index:1}
.sortb{all:unset;cursor:pointer;display:block;padding:6px 8px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.sortb:hover{color:var(--fg)}.sortb:focus-visible{outline:2px solid var(--accent)}
.mono{font-family:var(--mono)}
:root{--sub:#c08a1e}
.linkb{all:unset;cursor:pointer;display:block;width:100%;border-radius:6px}
.linkb:hover{background:var(--soft)}.linkb:focus-visible{outline:2px solid var(--accent)}
.linkb.on{background:var(--call)}
.top5{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.top5 .linkb{padding:4px 6px}
.qb{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;margin-right:4px;background:var(--same-bg);color:var(--same)}
.qb.bad{background:var(--bad-bg);color:var(--bad)}.qb.sub{background:color-mix(in srgb,var(--sub) 18%,transparent);color:var(--sub)}
.rmap{font-size:13px}.rmap th{white-space:nowrap}.rmap td{text-align:center;min-width:120px}
.rmap .rself{color:var(--faint);background:var(--soft)}
.rcell .rn{font-size:18px;font-weight:650}.rcell .rq{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;font-size:11px}
.qbars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-bottom:18px;position:relative}
.qcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative;min-width:6px}
.qstack{display:flex;flex-direction:column;border-radius:3px 3px 0 0;overflow:hidden;min-height:1px}
.qseg.good{background:var(--good)}.qseg.sub{background:var(--sub)}.qseg.bad{background:var(--bad)}
.qd{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--faint);white-space:nowrap}
.qcol:nth-child(even) .qd{visibility:hidden}
.lanes{display:flex;flex-direction:column;gap:6px}
.lane{display:grid;grid-template-columns:minmax(120px,170px) 1fr;align-items:center;gap:10px}
.lname{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltrack{position:relative;height:22px;background:var(--soft);border-radius:4px}
.seg{position:absolute;top:6px;height:10px;background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:2px}
.rdot{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--panel);cursor:default}
.rdot.good{background:var(--good)}.rdot.sub{background:var(--sub)}.rdot.bad{background:var(--bad)}
.rtl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,280px);gap:22px;align-items:start}
@media (max-width:1000px){.rtl-grid{grid-template-columns:minmax(0,1fr)}}
.rtl-main{min-width:0}
.rdefs{position:sticky;top:12px;border-left:1px solid var(--line);padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:13px}
@media (max-width:1000px){.rdefs{position:static;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}}
.rdefs dl{margin:0;display:flex;flex-direction:column;gap:2px}
.rdefs dt{font-weight:650;display:flex;align-items:center;gap:7px;margin-top:8px}
.rdefs dt .dot{margin:0}.rdefs dd{margin:0 0 0 17px;color:var(--muted);line-height:1.45}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.qchip{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.qchip .qn{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.qchip.good::before,.qchip.sub::before,.qchip.bad::before{content:"";width:8px;height:8px;border-radius:50%}
.qchip.good::before{background:var(--good)}.qchip.sub::before{background:var(--sub)}.qchip.bad::before{background:var(--bad)}
.qchip[aria-pressed="true"]{border-color:var(--accent);background:var(--call);font-weight:600}
.qchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.rdot{padding:0;cursor:pointer}
.rdot{transition:opacity .15s,transform .15s}
.rdot.dim{opacity:.12}
.lanes.has-sel .rdot:not(.sel){opacity:.12}
.lanes.has-sel .seg{opacity:.35}
.rdot.sel{transform:scale(1.6);z-index:3;opacity:1;box-shadow:0 0 0 2px var(--accent)}
.rdot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tr.rrow{cursor:pointer}tr.rrow:hover td{background:var(--soft)}
tr.rrow.hide{display:none}
tr.rrow.rsel td{background:var(--call)}
tr.rrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.clearsel{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:1px 8px;cursor:pointer}
.laxis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-left:calc(min(170px,30%) + 10px)}
@media print{.rdot{border-color:#fff}}
@media (max-width:640px){.spark{width:80px}.mexp{max-width:none}}
.amtags{margin-left:6px}.amtags .chip{margin-left:4px;font-size:11px}
.ambars{display:grid;gap:4px;max-width:640px}.ambar{display:grid;grid-template-columns:90px 1fr 140px;align-items:center;gap:8px;font-size:13px}
.ambar .t{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.ambar .f{display:block;height:100%;background:var(--accent)}
.ambar .n{color:var(--muted);font-variant-numeric:tabular-nums}
.secnav{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:4px 16px;padding:8px 14px;font-size:13px;background:var(--bg);border-bottom:1px solid var(--line);margin:-6px 0}
.secnav a{color:var(--muted);text-decoration:none}.secnav a:hover{color:var(--fg);text-decoration:underline}
section,details{scroll-margin-top:52px}
.attn{border:1px solid var(--line);border-left:4px solid var(--warn,#c98a14);border-radius:10px;background:var(--panel);padding:12px 14px}
.attn.clear{border-left-color:var(--good,#2f8f5b)}
.attn-h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.attn ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.attn li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.attn .gbtn.sm{white-space:nowrap}
.subsec{display:flex;flex-direction:column;gap:12px;margin-top:6px}.subh{font-size:15px;margin:0}
@media (max-width:640px){.attn li{grid-template-columns:auto 1fr}.attn li .gbtn{grid-column:2}.secnav{position:static}}
@media print{.secnav{display:none}}
@media (max-width:640px){.ctrls,.ctrls label{min-width:0;max-width:100%;flex-wrap:wrap}.ctrls select{max-width:100%;min-width:0}.exp{flex-wrap:wrap}}
.rfilt{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:4px 0 10px}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.rstat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.rstat .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.rstat .v{font-size:20px;font-weight:600}
#radios .sc-wrap.open .opt{display:none}
@media print{#radios .opt{display:table-cell!important}}

<body>
<div class="wrap" id="app"></div>
<script>
const DATA=/*__DATA__*/null;
const PAGE_SOURCE='<!doctype html>\n'+document.documentElement.outerHTML;
(function(){
const SRC=DATA.sources, EVT=DATA.eventTypes;
let SNAPS=DATA.snapshots.slice();
let cur=SNAPS.length-1, base=SNAPS.length>1?SNAPS.length-2:null, loadErr='';
if(DATA.view){if(DATA.view.cur!=null&&SNAPS[DATA.view.cur])cur=DATA.view.cur;base=DATA.view.base!=null&&SNAPS[DATA.view.base]?DATA.view.base:null}
const app=document.getElementById('app');

/* ---------- helpers ---------- */
const el=(t,a={},...kids)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(v==null)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};
const get=(o,p)=>(Array.isArray(p)?p:p.split('.')).reduce((x,k)=>x==null?x:x[k],o);
const nf=(v,d=1)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0});
const fd=s=>new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const fds=s=>new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
const win=S=>fds(S.window.t0)+' – '+fd(S.window.t1);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const days=S=>S.window.days;
const band=b=>b+' GHz';

function info(keys,extra){
  const pop=el('span',{class:'pop',role:'tooltip'},el('div',{class:'k'},'Source: Meraki Dashboard API v1 (read-only GET)'));
  for(const k of [].concat(keys||[])){const s=SRC[k];if(s)pop.append(el('code',{},s[0]),el('div',{class:'k'},'Lookback: '+s[1]))}
  if(extra)pop.append(el('div',{style:'margin-top:6px'},extra));
  return el('span',{class:'i',tabindex:'0',role:'button','aria-label':'Where this data comes from'},'i',pop);
}
function spark(series,opts={}){
  const ns='http://www.w3.org/2000/svg',w=200,h=30;
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('class','spark'+(opts.wide?' wide':''));svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('aria-hidden','true');
  const parts=series.filter(s=>s.pts&&s.pts.length);if(!parts.length)return svg;
  const vals=parts.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>v!=null);if(!vals.length)return svg;
  let lo=Math.min(...vals),hi=Math.max(...vals);if(opts.zero)lo=Math.min(0,lo);if(opts.hi!=null)hi=Math.max(hi,opts.hi);if(hi-lo<1e-9){hi+=1;lo-=1}
  const total=parts.reduce((t,s)=>t+s.pts.length,0);let off=0;
  for(const s of parts){const n=s.pts.length;
    const xy=s.pts.map((p,i)=>p[1]==null?null:[((off+i)/(Math.max(total-1,1)))*w,h-2-((p[1]-lo)/(hi-lo))*(h-4)]);
    const d=xy.reduce((acc,p,i)=>p?acc+(acc&&xy[i-1]?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1):acc,'');
    const pa=document.createElementNS(ns,'path');pa.setAttribute('d',d);pa.setAttribute('fill','none');pa.setAttribute('stroke',s.color);pa.setAttribute('stroke-width','1.6');pa.setAttribute('stroke-linejoin','round');pa.setAttribute('vector-effect','non-scaling-stroke');svg.append(pa);
    const last=[...xy].reverse().find(Boolean);if(last&&s.dot){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',last[0]);c.setAttribute('cy',last[1]);c.setAttribute('r','2.5');c.setAttribute('fill',s.color);svg.append(c)}
    off+=n;}
  return svg;
}

/* ---------- metric definitions ---------- */
const worstSnr=S=>{let w=null;for(const[b,v]of Object.entries(S.snr||{}))if(v.worst&&(w==null||v.worst.snr<w.snr))w={...v.worst,band:b};return w};
const authRate=S=>{const c=get(S,'connections.all');if(!c)return null;const t=c.success+c.failures;return t?100*c.auth/t:null};
const discPerClientDaily=S=>{const cl=Object.fromEntries(S.daily.clients||[]);return (S.daily.disconnects||[]).map(([d,v])=>[d,cl[d]?v/cl[d]:null])};
const M=[
 {g:'Client experience',desc:'Can devices join, stay connected and get a quick response?'},
 {id:'success',n:'Connection success',src:'connections',v:S=>get(S,'connections.all.successPct'),u:'%',d:1,hi:true,tgt:[95,'≥ 95%'],tol:.5,daily:S=>S.daily.successPct,
  x:'Share of join attempts that got all the way through association, authentication, DHCP and DNS.'},
 {id:'auth',n:'Auth failure rate',src:'connections',v:authRate,u:'%',d:1,hi:false,tgt:[1,'< 1%'],tol:.2,daily:S=>S.daily.authFail,dailyNote:'failures per day',
  x:'Join attempts that failed at the password (PSK) or 802.1X step. A rise usually means wrong credentials, expired certificates or RADIUS trouble.'},
 {id:'dot1x',n:'802.1X failures per day',src:'events',v:S=>S.rates.dot1xFailures/days(S),d:1,hi:false,tgt:[1,'< 1'],tol:.5,daily:S=>S.daily.dot1x,
  x:'EAP failures plus RADIUS and client timeouts from the event log.'},
 {id:'disc',n:'Disconnects per client per day',src:'events',v:S=>S.rates.disconnectsPerClientDay,d:1,hi:false,tgt:[10,'< 10'],tol:.05,rel:true,daily:discPerClientDaily,
  x:'Disassociations and deauthentications per client. Some are normal (leaving, roaming, sleeping phones); a high or rising figure points to roaming or coverage trouble.'},
 {id:'lat',n:'Latency, normal traffic',src:'latency',v:S=>get(S,'latency.all.bestEffortTraffic.avg'),u:' ms',d:1,hi:false,tgt:[10,'< 10 ms'],tol:.3,
  x:'Meraki’s average wireless latency between AP and client for ordinary data.'},
 {id:'voice',n:'Slow voice packets',src:'latency',v:S=>get(S,'latency.all.voiceTraffic.over32Pct'),u:'%',d:1,hi:false,tgt:[5,'< 5%'],tol:1,
  x:'Share of voice-marked traffic taking 32 ms or more over the air. Above 5% calls can sound choppy.'},
 {id:'loss',n:'Upstream packet loss',src:'packetLoss',v:S=>get(S,'packetLoss.all.upPct'),u:'%',d:1,hi:false,tgt:[1,'< 1%'],tol:.3,
  x:'Packets lost on the way from client to AP. Loss in this direction usually means clients with weak transmit power or poor signal.'},
 {g:'RF health',desc:'Is there airtime to spare, and can clients hear the APs clearly?'},
 {id:'u24',n:'Busiest 2.4 GHz radio',src:'radioUtil',v:S=>get(S,['utilByBand','2.4','busiestP95']),u:'%',d:0,hi:false,tgt:[40,'< 40%'],tol:2,daily:S=>get(S,['daily','busiestRadio','2.4']),
  x:'How busy the busiest 2.4 GHz radio is at busy times (95th percentile). Above 40% clients slow down; above 60% the channel is congested.'},
 {id:'u5',n:'Busiest 5 GHz radio',src:'radioUtil',v:S=>get(S,['utilByBand','5','busiestP95']),u:'%',d:0,hi:false,tgt:[40,'< 40%'],tol:2,daily:S=>get(S,['daily','busiestRadio','5']),
  x:'Same measure for 5 GHz, counting each 5 GHz radio separately on dual-5 GHz APs.'},
 {id:'u6',n:'Busiest 6 GHz radio',src:'radioUtil',v:S=>get(S,['utilByBand','6','busiestP95']),u:'%',d:0,hi:false,tgt:[40,'< 40%'],tol:2,daily:S=>get(S,['daily','busiestRadio','6']),
  x:'Same measure for 6 GHz, the cleanest band. Only Wi-Fi 6E and Wi-Fi 7 devices can use it.'},
 {id:'nonwifi',n:'Non-Wi-Fi interference',src:'radioUtil',v:S=>Math.max(0,...(S.radios||[]).map(r=>r.nonWifiP95||0)),u:'%',d:1,hi:false,tgt:[10,'< 10%'],tol:1,
  x:'Airtime taken by non-Wi-Fi energy (microwaves, Bluetooth, radar, faulty kit) on the worst radio at busy times.'},
 {id:'snr',n:'Weakest client signal',src:'signal',v:S=>(worstSnr(S)||{}).snr,u:' dB',d:0,hi:true,tgt:[25,'≥ 25 dB'],tol:1,daily:S=>S.daily.worstSnr,
  x:'Average signal-to-noise of clients on the AP and band where it is lowest. Under 25 dB connections get slower and less reliable.'},
 {id:'share56',n:'Clients on 5 or 6 GHz',src:'clients',v:S=>(S.bandShare['5']||0)+(S.bandShare['6']||0),u:'%',d:0,hi:true,tgt:[60,'≥ 60%'],tol:2,
  x:'Share of clients on the faster, less crowded bands. The rest are on 2.4 GHz.'},
 {id:'nbr',n:'Strong neighbouring networks',src:'airMarshal',v:S=>get(S,'neighbors.strongBssids'),d:0,hi:false,ctx:true,rel:true,tol:.1,
  x:'Other networks your APs hear at 25 dB or more. They compete for the same airtime.'},
 {g:'Roaming',desc:'When clients move between APs, do they move quickly and to a better signal?'},
 {id:'roamGood',n:'Good roams',src:'roaming',v:S=>{const t=get(S,'roaming.totals');return t&&t.roams?100*t.good/t.roams:null},u:'%',d:1,hi:true,tgt:[90,'≥ 90%'],tol:2,daily:S=>(get(S,'roaming.daily')||[]).map(([d,x])=>{const n=x.good+x.sub+x.bad;return[d,n?100*x.good/n:null]}),
  x:'Share of roams that were quick (under 1 second), landed on an equal or stronger signal, and kept the client connected.'},
 {id:'roamSub',n:'Suboptimal roams',src:'roaming',v:S=>{const t=get(S,'roaming.totals');return t&&t.roams?100*t.sub/t.roams:null},u:'%',d:1,hi:false,tol:1,daily:S=>(get(S,'roaming.daily')||[]).map(([d,x])=>[d,x.sub]),
  x:'Roams that worked but not cleanly: over 1 second, a weaker signal on the new AP, or off the network more than 10 seconds. Good + suboptimal + bad = 100% (each is rounded, so the shown figures can be 0.1 off).'},
 {id:'roamBad',n:'Bad roams',src:'roaming',v:S=>{const t=get(S,'roaming.totals');return t&&t.roams?100*t.bad/t.roams:null},u:'%',d:1,hi:false,tgt:[2,'< 2%'],tol:.5,daily:S=>(get(S,'roaming.daily')||[]).map(([d,x])=>[d,x.bad]),dailyNote:'bad roams per day',
  x:'Roams that took over 3 seconds, or landed on a signal 10 dB or more weaker (Meraki’s definition).'},
 {id:'roamMs',n:'Average roam time',src:'roaming',v:S=>get(S,'roaming.totals.avgMs'),u:' ms',d:0,hi:false,tgt:[150,'< 150 ms'],tol:10,
  x:'Time to move from one AP to the next. Fast roaming (802.11r) is usually under 50 ms; full 802.1X logins take longer.'},
 {id:'pingpong',n:'Ping-pong clients',src:'roaming',v:S=>get(S,'roaming.totals.pingPongClients'),d:0,hi:false,tgt:[1,'0'],tol:0,
  x:'Clients bouncing back to the AP they just left within 2 minutes, three or more times. Usually two APs overlapping with similar signal.'},
 {id:'sticky',n:'Sticky clients',src:'roaming',v:S=>get(S,'roaming.totals.stickyClients'),d:0,hi:false,tgt:[1,'0'],tol:0,
  x:'Clients Meraki flagged for holding on to a weak AP when a better one was available.'},
 {g:'Demand',desc:'How much the network is being asked to carry.'},
 {id:'clients',n:'Clients per day',src:'clients',v:S=>get(S,'clients.all'),d:0,ctx:true,tol:1,daily:S=>S.daily.clients,x:'Unique wireless clients each day, averaged.'},
 {id:'traffic',n:'Traffic per day',src:'usage',v:S=>get(S,'trafficGbPerDay.all'),u:' GB',d:1,ctx:true,tol:.5,daily:S=>S.daily.trafficGb,x:'Data carried by all APs each day, all bands.'},
];
const MET=M.filter(m=>!m.g);
/* Guidelines: shown only when the reader asks for them, never used to colour comparisons. */
const GUIDE={
 success:{b:'Common enterprise baseline: below about 95%, users start to notice failed or slow joins.',fp:'A few devices retrying a wrong password, or IoT devices with bad settings, can pull this down while everyone else connects fine. Check the client list before treating it as a network fault.'},
 auth:{b:'With working credentials and RADIUS, authentication failures are rare.',fp:'One device with an old password retrying all day can produce most of the failures.'},
 dot1x:{b:'Healthy 802.1X networks log almost no EAP failures or RADIUS timeouts.',fp:'Test accounts, guests trying the corporate SSID or expired certificates on a single laptop all count.'},
 disc:{b:'Rough estimate only; there is no industry standard for this.',fp:'Phones disassociate when they sleep, and roaming counts as a disconnect from the old AP. Networks with many phones or IoT devices run high and can be perfectly healthy.'},
 lat:{b:'Wi-Fi latency between AP and client is normally a few milliseconds.',fp:'Meraki’s average can look better than its own histogram shows; check slow voice packets too.'},
 voice:{b:'Voice design guides aim for low jitter; most samples should be well under 30 ms.',fp:'This uses whatever traffic is marked as voice. Without real voice devices, a handful of mismarked packets can dominate.'},
 loss:{b:'Above about 1% loss, real-time apps such as calls and video start to suffer.',fp:'A few clients at the edge of coverage can account for most of the loss.'},
 u24:{b:'Commonly cited point where Wi-Fi performance starts to drop. Above 60% the channel is congested.',fp:'In dense buildings 2.4 GHz is busy because of neighbouring networks, which you can’t control. Compare with the neighbouring-networks count.'},
 u5:{b:'Same rule of thumb as 2.4 GHz.',fp:'Short bursts (large downloads, backups) raise the peak without users noticing.'},
 u6:{b:'Same rule of thumb as 2.4 GHz.',fp:'Rarely busy because few devices support 6 GHz yet.'},
 nonwifi:{b:'Above about 10%, a nearby non-Wi-Fi source is taking real airtime.',fp:'Brief spikes (a microwave at lunch, radar on 5 GHz DFS channels) are normal; look for sustained levels.'},
 snr:{b:'Common minimum for reliable data. Voice designs often aim for 25–30 dB.',fp:'This is the weakest AP and band, often driven by a few clients far from the AP.'},
 roamGood:{b:'Rough estimate only; healthy networks with good overlap see most roams as good.',fp:'A couple of devices at the edge of coverage can produce most of the suboptimal roams.'},
 roamSub:{b:'No fixed rule; a falling share over time is what matters.',fp:'Clients walking out of range end on a weaker signal, which counts as suboptimal.'},
 roamBad:{b:'Bad roams should be rare. Each one is a likely drop or stall in a call or app.',fp:'Clients walking out of the building end their last roam on a weak signal.'},
 roamMs:{b:'Voice over Wi-Fi needs roams under about 150 ms; 802.11r keeps them under 50 ms.',fp:'One slow 802.1X roam among few roams pulls the average up.'},
 pingpong:{b:'Ideally no client ping-pongs.',fp:'A device sitting exactly between two APs can bounce without users noticing.'},
 sticky:{b:'Ideally no sticky clients.',fp:'Some devices (older phones, IoT) are known to be sticky whatever the network does.'},
 share56:{b:'Rough estimate only; depends on how many devices support 5 and 6 GHz.',fp:'IoT devices are often 2.4 GHz only, so a network with many of them will sit lower without anything being wrong.'},
};
const outside=(m,v)=>v!=null&&m.tgt&&!(m.hi?v>=m.tgt[0]:v<m.tgt[0]);
function trend(m,b,a){
  if(a==null||b==null)return null;
  const d=a-b, tol=m.rel?Math.abs(b)*m.tol:m.tol;
  if(Math.abs(d)<=tol)return{cls:'same',d};
  if(m.ctx)return{cls:'same',d,moved:true};
  return{cls:(m.hi?d>0:d<0)?'good':'bad',d};
}
const fmtVal=(m,v)=>v==null?'—':nf(v,m.d??1)+(m.u||'');
function fmtDelta(m,b,a){
  const d=a-b,sign=d>0?'+':d<0?'−':'';
  if((m.u||'').trim()==='%')return sign+nf(Math.abs(d),1)+' pts';
  if(m.u)return sign+nf(Math.abs(d),1)+m.u;
  return b?sign+nf(Math.abs(100*d/b),0)+'%':sign+nf(Math.abs(d),1);
}
const byId=Object.fromEntries(MET.map(m=>[m.id,m]));

/* ---------- overview tiles and their review guides ---------- */
const busiest=S=>{let best=null;for(const r of S.radios||[])if(r.p95!=null&&(best==null||r.p95>best.p95))best=r;return best};
const TILES=[
 {id:'success',k:'Connection success',m:'success',sub:S=>{const c=get(S,'connections.all');return c?`${nf(c.failures,0)} failed of ${nf(c.success+c.failures,0)} joins`:''},jump:'problem-clients'},
 {id:'auth',k:'Auth failure rate',m:'auth',sub:S=>`${nf(get(S,'connections.all.auth'),0)} auth failures · ${nf(S.rates.dot1xFailures,0)} 802.1X failures`,jump:'problem-clients'},
 {id:'radio',k:'Busiest radio at peak',m:null,v:S=>(busiest(S)||{}).p95,u:'%',d:0,hi:false,tol:2,sub:S=>{const b=busiest(S);return b?`${b.ap} · ${band(b.band)} ch ${b.channel}`:''},jump:'radios'},
 {id:'snr',k:'Weakest client signal',m:'snr',sub:S=>{const w=worstSnr(S);return w?`${w.ap} · ${band(w.band)}`:''},jump:'band'},
 {id:'loss',k:'Upstream packet loss',m:'loss',sub:S=>{const w=(S.apLoss||[])[0],c=topLossClients(S)[0];return w?`Client → AP. Worst AP: ${w.ap} ${nf(w.upPct,1)}%`+(c?` · ${c.name||c.mac} causes ${nf(c.share,0)}% of lost packets`:''):'Client → AP direction'},jump:'band'},
 {id:'roaming',k:'Good roams',m:'roamGood',sub:S=>{const t=get(S,'roaming.totals');return t?`${nf(t.roams,0)} roams · ${nf(t.sub,0)} suboptimal · ${nf(t.bad,0)} bad · avg ${nf(t.avgMs,0)} ms`:'Take a new snapshot to see roaming'},jump:'roaming'},
 {id:'clients',k:'Clients per day',m:'clients',sub:S=>`${nf(get(S,'trafficGbPerDay.all'),1)} GB of traffic a day`,jump:'band'},
];
const tileMetric=t=>t.m?byId[t.m]:{id:t.id,n:t.k,v:t.v,u:t.u,d:t.d,hi:t.hi,tol:t.tol,tgt:[40,'< 40%']};
function review(id,C){
  const w=worstSnr(C),b=busiest(C),c=get(C,'connections.all')||{},st=[['association',c.assoc],['authentication',c.auth],['DHCP',c.dhcp],['DNS',c.dns]].sort((x,y)=>y[1]-x[1])[0];
  const top=(C.events.topClients||[])[0],dot=(C.ssids||[]).filter(x=>(x.authMode||'').includes('8021x'));
  const R={
   success:{what:'Out of every join attempt, how many got all the way to a working connection.',

/* ---------- theme ---------- */
const THEME_KEY='wlan-snapshot-theme';
function setTheme(t){if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;try{localStorage.setItem(THEME_KEY,t)}catch(e){}render()}

const effectiveTheme=()=>theme==='dark'||theme==='light'?theme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
if(theme!=='auto')document.documentElement.dataset.theme=theme;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());

/* ---------- loading another snapshot ---------- */
function addSnapshot(obj,name){
  const sum=obj&&obj.summary;if(!obj||obj.tool!=='wlan-snapshot'||!sum)throw new Error(name+' isn\u2019t a WLAN Snapshot file. Pick a report (.html) or data file (.json) saved by this app.');
  const hourly=obj.radioHourly||Object.fromEntries(Object.entries(obj.radioUtil||{}).map(([k,v])=>[k,v.hourly||[]]));
  const dup=SNAPS.findIndex(s=>s.summary.capturedAt===sum.capturedAt&&s.summary.network===sum.network);
  if(dup>=0)return dup;
  SNAPS.push({summary:sum,radioHourly:hourly});
  const order=SNAPS.map((s,i)=>[s,i]).sort((a,b)=>a[0].summary.window.t1.localeCompare(b[0].summary.window.t1));
  const curS=SNAPS[cur],baseS=base!=null?SNAPS[base]:null,newS=SNAPS[SNAPS.length-1];
  SNAPS=order.map(x=>x[0]);cur=SNAPS.indexOf(curS);base=baseS?SNAPS.indexOf(baseS):null;return SNAPS.indexOf(newS);
}
/* Read snapshots from a data file (.json) or from any report (.html), which carries its data inside. */
function snapshotsFromText(text,name){
  const t=text.trimStart();
  if(t.startsWith('{'))return[JSON.parse(t)];
  const i=t.indexOf('const DATA=');if(i<0)throw new Error(name+' isn\u2019t a WLAN Snapshot report or data file.');
  const j=t.indexOf(';\nconst PAGE_SOURCE',i),k=j>0?j:t.indexOf(';\n(function(){',i);
  if(k<0)throw new Error(name+' looks like a report from an older version that can\u2019t be read back. Use its .json data file instead.');
  const d=JSON.parse(t.slice(i+11,k));
  return(d.snapshots||[]).map(x=>Object.assign({tool:'wlan-snapshot'},x));
}
const fileInput=el('input',{type:'file',accept:'.json,.html,.htm,application/json,text/html',id:'snapfile',onchange:e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const list=snapshotsFromText(rd.result,f.name);if(!list.length)throw new Error(f.name+' has no snapshots in it.');
      const curS=SNAPS[cur];const idx=list.map(x=>addSnapshot(x,f.name));const C0=SNAPS.indexOf(curS);
      const others=idx.filter(i=>i!==C0).sort((a,b)=>SNAPS[b].summary.window.t1.localeCompare(SNAPS[a].summary.window.t1));
      if(others.length){const i=others[0];if(SNAPS[i].summary.window.t1>SNAPS[C0].summary.window.t1){base=C0;cur=i}else{cur=C0;base=i}}
      loadErr=''}catch(err){loadErr=err.message}render()};
  rd.readAsText(f);e.target.value=''}});
document.body.append(fileInput);

/* When opened through the local app, offer the other saved snapshots of this network. */
let SAVED=[];
if(location.protocol.startsWith('http')){fetch('/local/snapshots').then(r=>r.ok?r.json():null).then(j=>{if(!j)return;
  SAVED=j.snapshots||[];render()}).catch(()=>{})}
async function loadSaved(file){
  try{const r=await fetch('/snapshots/'+encodeURIComponent(file));if(!r.ok)throw new Error('Could not open '+file);
    const i=addSnapshot(await r.json(),file);if(i===cur)return render();
    if(SNAPS[i].summary.window.t1>SNAPS[cur].summary.window.t1){base=cur;cur=i}else base=i;loadErr=''}catch(e){loadErr=e.message}render()}

/* ---------- export ---------- */
function safeName(t){return (t||'report').replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'')}
function exportData(){
  const S=SNAPS[cur],C=S.summary;
  const blob=new Blob([JSON.stringify({tool:'wlan-snapshot',summary:C,radioHourly:S.radioHourly||{},exportedAt:new Date().toISOString()})],{type:'application/json'});
  const a=el('a',{href:URL.createObjectURL(blob),download:`${safeName(C.network)}-${safeName(C.label)}-${C.window.t1.slice(0,10)}.json`});
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function exportHtml(){
  const C=SNAPS[cur].summary,P=base!=null?SNAPS[base].summary:null;
  const payload=Object.assign({},DATA,{snapshots:SNAPS,view:{cur,base},exportedAt:new Date().toISOString()});
  const json=JSON.stringify(payload).replace(/</g,'\\u003c');
  const i=PAGE_SOURCE.indexOf('const DATA='),j=PAGE_SOURCE.indexOf(';\nconst PAGE_SOURCE',i);
  if(i<0||j<0){loadErr='Export failed: could not read the report source.';return render()}
  const html=PAGE_SOURCE.slice(0,i)+'const DATA='+json+PAGE_SOURCE.slice(j);
  const name=`${safeName(C.network)}-${safeName(C.label)}${P?'-vs-'+safeName(P.label):''}-${C.window.t1.slice(0,10)}.html`;
  const a=el('a',{href:URL.createObjectURL(new Blob([html],{type:'text/html'})),download:name});
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
let printing=false;
function exportPdf(){
  /* Print in the light theme with every section expanded; the browser's print dialog saves it as PDF. */
  const prev=document.documentElement.dataset.theme;
  printing=true;document.documentElement.dataset.theme='light';render();
  document.querySelectorAll('details').forEach(d=>d.open=true);
  const done=()=>{printing=false;if(prev)document.documentElement.dataset.theme=prev;else delete document.documentElement.dataset.theme;render();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),50);
}
